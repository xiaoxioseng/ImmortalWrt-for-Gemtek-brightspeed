# build-revision: 5
name: Build XR1710G Datapath Test

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Source branch or commit to build'
        required: true
        default: 'xr1710g-datapath-stability-20260927'
        type: string
  push:
    branches:
      - master
    paths:
      - '.github/workflows/build-xr1710g-datapath-test.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEFAULT_SOURCE_REF: e04bb4565da8d05f347e91ce63b36723bb28e057

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Resolve source ref
        id: source
        shell: bash
        run: |
          ref='${{ github.event.inputs.source_ref }}'
          if [ -z "$ref" ]; then
            ref="$DEFAULT_SOURCE_REF"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Building source ref: $ref"

      - name: Checkout selected source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.ref }}
          fetch-depth: 0

      - name: Show source revision
        shell: bash
        run: |
          {
            echo "requested_ref=${{ steps.source.outputs.ref }}"
            echo "resolved_sha=$(git rev-parse HEAD)"
            echo "resolved_short_sha=$(git rev-parse --short=12 HEAD)"
            echo "branch=$(git branch --show-current)"
          } | tee build-source.txt
          git status --short

      - name: Setup build environment
        run: |
          sudo apt update
          sudo apt install -y build-essential clang gcc g++ binutils bzip2 gawk gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip wget xsltproc zlib1g-dev file which perl sed make

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          bash scripts/fix-stale-golang-host.sh

      - name: Apply feed patches
        run: FEED_PATCHES_STRICT=1 bash scripts/apply-feed-patches.sh

      - name: Configure XR1710G
        shell: bash
        run: |
          cp 1710.config .config
          build_date=$(date -u +%Y%m%d)
          build_sha=$(git rev-parse --short=8 HEAD)
          build_version="${build_date}-${build_sha}"
          sed -i "s/^CONFIG_VERSION_NUMBER=.*/CONFIG_VERSION_NUMBER=\"${build_version}\"/" .config
          sed -i "s/^CONFIG_VERSION_CODE=.*/CONFIG_VERSION_CODE=\"${build_version}\"/" .config
          echo "Stamped firmware version: ${build_version}"
          make defconfig
          bash scripts/check-gemtek-profile-isolation.sh --config .config

      - name: Download sources
        run: make download -j$(nproc)

      - name: Build firmware
        shell: bash
        run: |
          set -o pipefail
          make -j2 world 2>&1 | tee build.log

      - name: Verify mesh forward path was compiled
        shell: bash
        run: |
          mapfile -t iface_objects < <(find build_dir/target-aarch64_cortex-a53_musl/linux-airoha_an7581 -path '*/backports-*/net/mac80211/iface.o' -print)
          if [ "${#iface_objects[@]}" -eq 0 ]; then
            echo "No compiled mac80211 iface.o found" >&2
            exit 1
          fi
          for object in "${iface_objects[@]}"; do
            bash scripts/check-xr1710g-mesh-forward-path.sh "${object%/net/mac80211/iface.o}"
          done

      - name: Capture verbose failure
        if: failure()
        shell: bash
        run: |
          set +e
          : > build-verbose.log

          failed_pkg=$(grep 'ERROR:.*failed to build' build.log | head -1 | sed 's/.*ERROR: \(.*\) failed to build.*/\1/' || true)
          echo "Detected failed target/package: ${failed_pkg:-<none>}" | tee -a build-verbose.log

          if [ "$failed_pkg" = "target/linux" ]; then
            echo "=== Rebuilding target/linux with V=s -j1 ===" | tee -a build-verbose.log
            make target/linux/compile V=s -j1 2>&1 | tee -a build-verbose.log
          elif [ -n "$failed_pkg" ]; then
            echo "=== Rebuilding package/$failed_pkg/compile with V=s -j1 ===" | tee -a build-verbose.log
            make "package/$failed_pkg/compile" V=s -j1 2>&1 | tee -a build-verbose.log
          else
            echo "=== Could not identify failed package; rebuilding target/linux first ===" | tee -a build-verbose.log
            make target/linux/compile V=s -j1 2>&1 | tee -a build-verbose.log
          fi

          echo "=== Error summary ===" | tee -a build-verbose.log
          grep -niE 'error:|fatal error:|Error [0-9]|FAILED|Patch failed|Hunk #[0-9]+ FAILED|No rule to make target|not found' build-verbose.log | head -160 || true

      - name: List output
        if: always()
        run: |
          ls -la bin/targets/airoha/an7581/ 2>/dev/null || true
          echo '=== build.log tail ==='
          tail -160 build.log 2>/dev/null || true
          echo '=== build-verbose.log error summary ==='
          grep -niE 'error:|fatal error:|Error [0-9]|FAILED|Patch failed|Hunk #[0-9]+ FAILED|No rule to make target|not found' build-verbose.log 2>/dev/null | head -160 || true

      - name: Upload firmware and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xr1710g-datapath-test
          path: |
            build-source.txt
            build.log
            build-verbose.log
            bin/targets/airoha/an7581/*.itb
            bin/targets/airoha/an7581/*manifest
            bin/targets/airoha/an7581/config.buildinfo
            bin/targets/airoha/an7581/feeds.buildinfo
            bin/targets/airoha/an7581/version.buildinfo
            bin/targets/airoha/an7581/sha256sums
          retention-days: 30
